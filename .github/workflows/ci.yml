name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows-python-312:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "image-processing/requirements.lock"

      - name: Install hash-locked dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          --only-binary=:all: --require-hashes
          -r image-processing/requirements.lock

      - name: Validate dependencies
        run: python -m pip check

      - name: Validate Skill structure
        run: python scripts/validate-skill.py image-processing

      - name: Run tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: >-
          python -m pytest -q -p no:cacheprovider
          --basetemp="${{ runner.temp }}\image-processing-pytest"

      - name: Audit tracked files for private data
        shell: pwsh
        run: ./scripts/privacy-audit.ps1
