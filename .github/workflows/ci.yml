name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows-python-312:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "image-processing/requirements.lock"

      - name: Install hash-locked dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          --only-binary=:all: --require-hashes
          -r image-processing/requirements.lock

      - name: Validate dependencies
        run: python -m pip check

      - name: Validate Skill structure
        run: python scripts/validate-skill.py image-processing

      - name: Run tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: >-
          python -m pytest -q -p no:cacheprovider
          --basetemp="${{ runner.temp }}\image-processing-pytest"

      - name: Audit tracked files for private data
        shell: pwsh
        run: ./scripts/privacy-audit.ps1
